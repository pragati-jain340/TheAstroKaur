[project]
name = "theastrokaur"
version = "0.1.0"
description = "TheAstroKaur - Minimalist Vedic Astrology Platform & Backend Utilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "supabase>=2.13.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
